[workspace]
resolver = "2"
members = [
    "crates/estatetrace",
    "crates/estatetrace-core",
    "crates/estatetrace-db",
    "crates/estatetrace-azure",
    "crates/estatetrace-policy",
    "crates/estatetrace-integrations",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
authors = ["EstateTrace"]

[workspace.dependencies]
estatetrace-core = { path = "crates/estatetrace-core" }
estatetrace-db = { path = "crates/estatetrace-db" }
estatetrace-azure = { path = "crates/estatetrace-azure" }
estatetrace-policy = { path = "crates/estatetrace-policy" }
estatetrace-integrations = { path = "crates/estatetrace-integrations" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures = "0.3"
hex = "0.4"
http = "1"
keyring = { version = "3", features = ["windows-native"] }
mime_guess = "2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
zip = "2"